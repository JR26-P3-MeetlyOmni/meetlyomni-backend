name: Backend-CI/CD-dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: "./MeetlyOmni.sln"
  API_PROJECT: "src/MeetlyOmni.Api/MeetlyOmni.Api.csproj"
  PUBLISH_DIR: "publish"
  AWS_REGION: "ap-southeast-2"
  ECR_REPO: "meetlyomni-backend"
  IMAGE_TAG: ${{ github.sha }}
  DOCKERFILE: "src/MeetlyOmni.Api/Dockerfile"

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # 从仓库 Secrets 读取 dev 环境连接串；PR（尤其来自 fork）通常拿不到 secrets -> 为空 -> 迁移步骤会跳过
      CONNECTION_STRING: ${{ secrets.DEV_DB_CONNSTR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} -c Release --no-build

      # 仅在 push 且连接串存在时对“外部 dev DB”执行迁移，避免 PR 动到数据库
      - name: Apply EF migrations to external DB
        if: github.event_name == 'push' && env.CONNECTION_STRING && env.CONNECTION_STRING != ''
        env:
          ConnectionStrings__MeetlyOmniDb: ${{ env.CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool restore || true
          dotnet ef database update --project ${{ env.API_PROJECT }} --no-build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o ${{ env.PUBLISH_DIR }} /p:UseAppHost=false --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: warn

  docker:
    name: Build & Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: vars
        run: |
          echo "ECR_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "ECR_URI_LATEST=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ steps.vars.outputs.ECR_URI }}
            ${{ steps.vars.outputs.ECR_URI_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image
        run: |
          echo "Pushed:"
          echo "  ${{ steps.vars.outputs.ECR_URI }}"
          echo "  ${{ steps.vars.outputs.ECR_URI_LATEST }}"


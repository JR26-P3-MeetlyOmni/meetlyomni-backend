name: CICD-Dev-AWS

on:
  push:
    branches: ["feat/*", "devops/*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0
  SOLUTION_PATH: ./MeetlyOmni.sln
  API_PROJECT: src/MeetlyOmni.Api/MeetlyOmni.Api.csproj
  DOCKERFILE: ./Dockerfile.dev
  CONTEXT: .
  TAG_ENV: dev
  REPO: meetlyomni-backend
  ECR_URI: 034362033405.dkr.ecr.ap-southeast-2.amazonaws.com/meetlyomni-backend
  ECR_REPO: meetlyomni-backend
  AWS_REGION: ap-southeast-2
  ECS_TASK_FAMILY: meetlyomniapi-task
  ECS_CLUSTER: meetlyomniapi-cluster
  ECS_SERVICE: meetlyomniapi-svc

jobs:
  CI:
    runs-on: ubuntu-latest
    environment: dev
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: usr
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready -U usr -d testdb"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # cache: true

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Unit Test
        run: dotnet test src/MeetlyOmni.Unit.tests/MeetlyOmni.Unit.tests.csproj -c Release --no-build

      - name: Wait Testdb ready
        run: |
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U usr -d testdb && break || sleep 1
          done

      - name: Run API for Integration Test
        env:
          ASPNETCORE_URLS: http://localhost:7011
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__MeetlyOmniDb: Host=localhost;Port=5432;Database=testdb;Username=usr;Password=pass
        run: |
          nohup dotnet run --no-build --configuration Release \
            --project src/MeetlyOmni.Api/MeetlyOmni.Api.csproj -- \
            --urls http://127.0.0.1:7011 > api.log 2>&1 &
          echo $! > api.pid

          for i in {1..120}; do
            if curl -fsS --max-time 2 --retry 1 --retry-connrefused http://127.0.0.1:7011/swagger/index.html > /dev/null; then
              echo "API is up"; break; fi
            sleep 1
          done


          if ! curl -fsS --max-time 2 http://127.0.0.1:7011/swagger/index.html > /dev/null; then
            echo "API failed to start. Dumping logs:"
            grep -E "Now listening on|Started|fail|error|warn" -i api.log || true
            tail -n 200 api.log || true
            exit 1
          fi

      - name: Integration Test
        env:
          BASE_URL: http://localhost:7011
        run: |
          dotnet test src/MeetlyOmni.IntegrationTests/MeetlyOmni.IntegrationTests.csproj -c Release --no-build
          kill $(cat api.pid) || true

  build_and_push_image:
    runs-on: ubuntu-latest
    environment: dev
    needs: CI
    permissions:
      id-token: write
      contents: read

    # if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker build \
            -f "${{ env.DOCKERFILE }}" \
            -t "${{ env.ECR_URI }}:${TAG_SHA}" \
            -t "${{ env.ECR_URI }}:${{ env.TAG_ENV }}" \
            "${{ env.CONTEXT }}"

      - name: Push Docker images
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker push "${{ env.ECR_URI }}:${TAG_SHA}"
          docker push "${{ env.ECR_URI }}:${{ env.TAG_ENV }}"

  deploy_ecs:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    environment: dev
    env:
      CONTAINER_NAME: api
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Image URI
        id: img
        run: echo "uri=${ECR_URI}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/workflows/taskdef-1.json
          container-name: ${{env.CONTAINER_NAME}}
          image: ${{ steps.img.outputs.uri }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


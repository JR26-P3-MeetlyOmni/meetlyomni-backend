name: CI-Dev-Azure

on:
  # push:
  #   branches: [dev, devops/leonard]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # ---- Azure / ACR ----
  AZURE_CONTAINER_REGISTRY: meetlyapiacr
  ACR_REPO: meetlyomni-backend
  # ---- Web App ----
  WEBAPP_NAME: meetly-api-dev
  WEBAPP_RESOURCE_GROUP: rg-meetly-api-dev
  # ---- .NET & Docker ----
  DOTNET_VERSION: 8.0
  SOLUTION_PATH: ./MeetlyOmni.sln
  API_PROJECT: src/MeetlyOmni.Api/MeetlyOmni.Api.csproj
  DOCKERFILE: ./src/MeetlyOmni.Api/Dockerfile-2
  CONTEXT: .
  TAG_ENV: dev

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      image: ${{ steps.img.outputs.image }}
      login_server: ${{ steps.acr.outputs.login_server }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test (unit)
        run: dotnet test src/MeetlyOmni.Unit.tests/MeetlyOmni.Unit.tests.csproj -c Release --no-build
        continue-on-error: true

      # 登录 Azure（OIDC 无密钥）
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          LOGIN_SERVER=$(az acr show -n "${{ env.AZURE_CONTAINER_REGISTRY }}" --query loginServer -o tsv)
          echo "login_server=$LOGIN_SERVER" >> $GITHUB_OUTPUT

      - name: ACR docker login (via az)
        run: az acr login -n "${{ env.AZURE_CONTAINER_REGISTRY }}"

      - name: Build & Push Docker image
        run: |
          set -e
          LOGIN_SERVER="${{ steps.acr.outputs.login_server }}"
          TAG_SHA="${GITHUB_SHA::7}"

          docker build \
            -f "${{ env.DOCKERFILE }}" \
            -t "${LOGIN_SERVER}/${{ env.ACR_REPO }}:${TAG_SHA}" \
            -t "${LOGIN_SERVER}/${{ env.ACR_REPO }}:${{ env.TAG_ENV }}" \
            "${{ env.CONTEXT }}"

          docker push "${LOGIN_SERVER}/${{ env.ACR_REPO }}:${TAG_SHA}"
          docker push "${LOGIN_SERVER}/${{ env.ACR_REPO }}:${{ env.TAG_ENV }}"

      - name: Set image output
        id: img
        run: |
          echo "image=${{ steps.acr.outputs.login_server }}/${{ env.ACR_REPO }}:${{ env.TAG_ENV }}" >> $GITHUB_OUTPUT

  deploy_webapp:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # （可选）给 Web App 的托管身份赋 AcrPull（若你用 MSI 拉私有 ACR 就需要）
      # 先确保 Web App 已启用系统分配的托管身份，再解除下面注释：
      # - name: Grant AcrPull to Web App MSI
      #   run: |
      #     PRINCIPAL_ID=$(az webapp identity show -g "${{ env.WEBAPP_RESOURCE_GROUP }}" -n "${{ env.WEBAPP_NAME }}" --query principalId -o tsv)
      #     ACR_ID=$(az acr show -n "${{ env.AZURE_CONTAINER_REGISTRY }}" --query id -o tsv)
      #     az role assignment create \
      #       --assignee-object-id "$PRINCIPAL_ID" \
      #       --assignee-principal-type ServicePrincipal \
      #       --role "AcrPull" \
      #       --scope "$ACR_ID"

      # ★ 注入应用设置（包含 DB 连接串等）
      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            -g "${{ env.WEBAPP_RESOURCE_GROUP }}" \
            -n "${{ env.WEBAPP_NAME }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Development \
              ASPNETCORE_URLS=http://0.0.0.0:80 \
              WEBSITES_PORT=80 \
              ConnectionStrings__MeetlyOmniDb="${{ secrets.DEV_DB_CONNECTION_STRING }}"

      # （可选）设置健康检查路径
      - name: Configure Health Check
        run: |
          az webapp update \
            -g "${{ env.WEBAPP_RESOURCE_GROUP }}" \
            -n "${{ env.WEBAPP_NAME }}" \
            --set siteConfig.healthCheckPath="/health"

      # 部署：指向 ACR 镜像（:dev）
      - name: Deploy to Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ needs.build_and_push.outputs.image }}


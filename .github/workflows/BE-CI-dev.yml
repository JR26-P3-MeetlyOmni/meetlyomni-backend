name: BE-CI

on:
  push:
    branches: [dev, devops/leonard]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0
  SOLUTION_PATH: ./MeetlyOmni.sln
  API_PROJECT: src/MeetlyOmni.Api/MeetlyOmni.Api.csproj
  DOCKERFILE: ./src/MeetlyOmni.Api/Dockerfile-1
  CONTEXT: .
  TAG_ENV: dev
  REPO: meetlyomni-backend
  ECR_URI: 034362033405.dkr.ecr.ap-southeast-2.amazonaws.com/meetlyomni-backend
  AWS_REGION: ap-southeast-2

jobs:
  CI:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # cache: true

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test (unit)
        run: dotnet test src/MeetlyOmni.Unit.tests/MeetlyOmni.Unit.tests.csproj -c Release --no-build

      - name: Test (integration)
        env:
          BASE_URL: http://localhost:7011
        run: dotnet test src/MeetlyOmni.IntegrationTests/MeetlyOmni.IntegrationTests.csproj -c Release --no-build
        continue-on-error: true

  build_and_push_image:
    runs-on: ubuntu-latest

    environment: dev
    needs: CI
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker build \
            -f "${{ env.DOCKERFILE }}" \
            -t "${{ env.ECR_URI }}:${TAG_SHA}" \
            -t "${{ env.ECR_URI }}:${{ env.TAG_ENV }}" \
            "${{ env.CONTEXT }}"

      - name: Push Docker images
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker push "${{ env.ECR_URI }}:${TAG_SHA}"
          docker push "${{ env.ECR_URI }}:${{ env.TAG_ENV }}"


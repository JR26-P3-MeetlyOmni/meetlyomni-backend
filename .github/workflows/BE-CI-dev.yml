name: BE-CI

on:
  push:
    branches: [dev, devops/leonard]
  pull_request:
    branches: [dev]
  workflow_dispatch:

env:
  DOTNET_VERSION: 8.0
  SOLUTION_PATH: ./MeetlyOmni.sln
  API_PROJECT: src/MeetlyOmni.Api/MeetlyOmni.Api.csproj
  DOCKERFILE: ./src/MeetlyOmni.Api/Dockerfile-1
  CONTEXT: .
  TAG_ENV: dev
  REPO: meetlyomni-backend
  ECR_URI: 034362033405.dkr.ecr.ap-southeast-2.amazonaws.com/meetlyomni-backend
  AWS_REGION: ap-southeast-2

jobs:
  CI:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # cache: true

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Test (unit)
        run: dotnet test src/MeetlyOmni.Unit.tests/MeetlyOmni.Unit.tests.csproj -c Release --no-build

      # 确认 DB 连接串有没有注入（不打印内容，只检查是否为空）
      - name: Sanity check DB conn string presence
        run: |
          if [ -z "${ConnectionStrings__MeetlyOmniDb}" ]; then
            echo "ERROR: secrets.DEV_DB_CONNECTION_STRING is empty or not set"
            exit 1
          else
            echo "OK: ConnectionStrings__MeetlyOmniDb is present (masked)"
          fi
        env:
          ConnectionStrings__MeetlyOmniDb: ${{ secrets.DEV_DB_CONNECTION_STRING }}

      # 启动 API 并将日志写入文件；失败时能看到日志
      - name: Start API on :7011
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://0.0.0.0:7011
          ConnectionStrings__MeetlyOmniDb: ${{ secrets.DEV_DB_CONNECTION_STRING }}
        run: |
          nohup dotnet run --project "${{ env.API_PROJECT }}" -c Release --no-build \
      --urls http://0.0.0.0:7011 > api.log 2>&1 &
          echo $! > api.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:7011/health >/dev/null; then
              echo "API is up"; break
            fi
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "API process exited early. Last 200 lines:"; tail -n 200 api.log || true
              exit 1
            fi
            sleep 1
          done

      # 集成测试；无论成功失败，都把 API 日志打出来并清理
      - name: Test (integration)
        env:
          BASE_URL: http://localhost:7011
        run: dotnet test src/MeetlyOmni.IntegrationTests/MeetlyOmni.IntegrationTests.csproj -c Release --no-build

      - name: Dump API logs & cleanup
        if: ${{ always() }}
        run: |
          echo "===== api.log (tail) ====="
          tail -n 200 api.log || true
          if [ -f api.pid ]; then
            kill -9 "$(cat api.pid)" || true
          fi

  build_and_push_image:
    runs-on: ubuntu-latest

    environment: dev
    needs: CI
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker build \
            -f "${{ env.DOCKERFILE }}" \
            -t "${{ env.ECR_URI }}:${TAG_SHA}" \
            -t "${{ env.ECR_URI }}:${{ env.TAG_ENV }}" \
            "${{ env.CONTEXT }}"

      - name: Push Docker images
        run: |
          TAG_SHA=${GITHUB_SHA::7}
          docker push "${{ env.ECR_URI }}:${TAG_SHA}"
          docker push "${{ env.ECR_URI }}:${{ env.TAG_ENV }}"


name: .NET CI (PR) & Build Image

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  SOLUTION_PATH: "./MeetlyOmni.sln"
  API_PROJECT: "src/MeetlyOmni.Api/MeetlyOmni.Api.csproj"
  PUBLISH_DIR: "publish"
  DOTNET_VERSION: "8.0.x"

jobs:
  ci:
    name: CI - Restore/Build/Test/Lint/Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore local tools (optional)
        run: dotnet tool restore || true

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes
        continue-on-error: false

      - name: Test (with coverage)
        run: >
          dotnet test ${{ env.SOLUTION_PATH }} -c Release --no-build
          --logger "trx;LogFileName=test_results.trx"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./TestResults/coverage.cobertura.xml
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish API
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          -c Release -o ${{ env.PUBLISH_DIR }} /p:UseAppHost=false --no-restore

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  docker:
    name: Build & Push Docker Image (ECR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs: ci
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPO: meetlyomni-backend
      IMAGE_TAG: ${{ github.sha }}
      PLATFORM: linux/amd64
      DOCKERFILE: Dockerfile.slim
    steps:
      - uses: actions/checkout@v4

      # 下载 CI 产物到 ./publish （与 Dockerfile.slim 的 COPY 对应）
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: vars
        run: |
          echo "ECR_URI=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
          echo "ECR_URI_LATEST=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.vars.outputs.ECR_URI }}
            ${{ steps.vars.outputs.ECR_URI_LATEST }}

      - name: Output image
        run: |
          echo "Pushed:"
          echo "  ${{ steps.vars.outputs.ECR_URI }}"
          echo "  ${{ steps.vars.outputs.ECR_URI_LATEST }}"

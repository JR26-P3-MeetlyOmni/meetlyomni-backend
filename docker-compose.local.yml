version: "3.9"

services:
  db:
    image: postgres:15
    container_name: meetlyomni-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetlyomni
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetlyomni"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: meetlyomni-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: ./src/MeetlyOmni.Api/Dockerfile
    container_name: meetlyomni-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=meetlyomni;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:


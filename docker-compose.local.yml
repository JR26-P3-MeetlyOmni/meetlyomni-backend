services:
  db:
    image: postgres:alpine
    container_name: meetlyomni-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetlyomni
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetlyomni"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: meetlyomni-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

  api:
    # 若本地已有 meetlyomni-api:local，将直接使用；如需重建，仍会基于下方 build 规则构建
    image: meetlyomni-api:local
    build:
      context: .
      dockerfile: ./src/MeetlyOmni.Api/Dockerfile-1
    container_name: meetlyomni-api
    restart: unless-stopped
    ports:
      - "5001:80" # 本机 http://localhost:5001 -> 容器 80
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # 与代码一致（ECS 也用了这个键）：ConnectionStrings__MeetlyOmniDb
      ConnectionStrings__MeetlyOmniDb: "Host=db;Port=5432;Database=meetlyomni;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:

